[package]
name = "nova-review"
default-run = "nova-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish = false

[dependencies]
nova-model-runtime = { path = "../../crates/nova-model-runtime" }
anyhow.workspace = true
libc = "0.2"
url = "2.5"
axum.workspace = true
clap.workspace = true
nova-mcp = { path = "../nova-mcp" }
nova-core = { path = "../../crates/nova-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "io-std", "io-util", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp.workspace = true
tempfile.workspace = true
zeroize.workspace = true
sha2.workspace = true
uuid.workspace = true
nova-time = { package = "time", version = "0.3", features = ["formatting"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
