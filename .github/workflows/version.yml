name: Version metadata
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify version metadata and changelog
        run: python3 scripts/version.py check
      - name: Check multilingual documentation links
        run: python3 scripts/check_docs_languages.py
      - name: Test version changes and downgrade protection
        run: python3 -m unittest discover -s scripts/tests -p test_product_version.py
      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/version.py check --tag "$RELEASE_TAG"
